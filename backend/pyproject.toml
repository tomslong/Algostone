[project]
name = "algostone-backend"
version = "0.1.0"
description = "Backend for AlgoStone - AI-powered Algorithm Learning Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.10",
    "langsmith>=0.0.80",
    "langchain-openai>=0.0.2",
    "langchain-text-splitters>=0.0.1",
    "sentence-transformers>=2.2.2",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",
    "redis>=5.0.1",
    "celery>=5.3.6",
    "httpx>=0.26.0",
    "python-multipart>=0.0.7",
    "sentry-sdk>=1.40.0",
    "logfire>=0.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "cryptography>=46.0.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "playwright>=1.41.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "ruff>=0.1.15",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.1.15",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "playwright>=1.41.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
